<svg class="kinetic-pour-native-emblem" viewBox="0 0 500 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kinetic Pour // Engineered Fluidics">
  <defs>

    <!-- Ambient Core Furnace Glow -->
    <radialGradient id="kpFurnaceCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3b14" stop-opacity="0.65" />
      <stop offset="30%" stop-color="#ff9900" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#ff3b14" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fluted 3D Glass Cylinder Surface Shading -->
    <linearGradient id="ribGlassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="15%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="42%" stop-color="rgba(8, 8, 12, 0.95)" />
      <stop offset="50%" stop-color="rgba(255, 170, 0, 0.88)" />
      <stop offset="58%" stop-color="rgba(8, 8, 12, 0.95)" />
      <stop offset="85%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.65)" />
    </linearGradient>

    <!-- Liquid Fluid Core Stream Gradient -->
    <linearGradient id="liquidCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff0d0" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#ffaa00" stop-opacity="1" />
      <stop offset="70%" stop-color="#ff5722" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#ff3b14" stop-opacity="1" />
    </linearGradient>

    <!-- Outer Droplet Glass Wall Gradient -->
    <linearGradient id="dropletWallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="70%" stop-color="rgba(255, 170, 0, 0.35)" />
      <stop offset="100%" stop-color="rgba(255, 59, 20, 0.8)" />
    </linearGradient>

    <!-- Drip Liquid Taper Gradient -->
    <linearGradient id="dripFlowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbf1e2" />
      <stop offset="35%" stop-color="#f5cc8e" />
      <stop offset="70%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff3b14" />
    </linearGradient>

    <!-- Diagonal Refractive Specular Sheen -->
    <linearGradient id="specularSweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="transparent" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.7)" />
      <stop offset="60%" stop-color="transparent" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Clip Path of Teardrop Droplet -->
    <clipPath id="dropletClip">
      <path d="M 250,38 C 256,48 376,176 376,276 C 376,346 320,396 250,396 C 180,396 124,346 124,276 C 124,176 244,48 250,38 Z" />
    </clipPath>

    <!-- Ember Glow Filter for Typography & Drips -->
    <filter id="kpEmberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur1" />
      <feGaussianBlur stdDeviation="8" in="SourceGraphic" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

